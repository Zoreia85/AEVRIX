name: Desktop patch envelope transport

on:
  push:
    branches: [candidate/desktop-bot-patch-20260816-b]
    paths:
      - ".github/workflows/desktop-patch-envelope.yml"

permissions:
  contents: read

jobs:
  envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: bffaa2d43ea2d9f7ed587fa186b64cbc422bc320
    steps:
      - name: Checkout transport candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and validate product-only patch
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --binary "$BASE_SHA" HEAD -- \
            apps/aevrix-windows/src/AEVRIX.Desktop \
            apps/aevrix-windows/tests/AEVRIX.Core.Tests/EngineHostSupervisorTests.cs \
            > /tmp/aevrix-desktop.patch
          test -s /tmp/aevrix-desktop.patch
          test "$(wc -c < /tmp/aevrix-desktop.patch)" -lt 1500000
          git worktree add --detach /tmp/aevrix-base "$BASE_SHA"
          git -C /tmp/aevrix-base apply --check /tmp/aevrix-desktop.patch
          if grep -q '^diff --git a/\.github/workflows/' /tmp/aevrix-desktop.patch; then
            echo "Workflow content leaked into product patch."
            exit 1
          fi

      - name: Split validated patch into queue envelopes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/envelopes
          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib
          import re

          raw = pathlib.Path('/tmp/aevrix-desktop.patch').read_bytes()
          starts = [m.start() for m in re.finditer(br'(?m)^diff --git ', raw)]
          starts.append(len(raw))
          if len(starts) <= 1:
              raise SystemExit('no file patches found')
          for index, (start, end) in enumerate(zip(starts, starts[1:]), 1):
              chunk = raw[start:end]
              first_line = chunk.splitlines()[0].decode('utf-8', errors='strict')
              match = re.match(r'diff --git a/(.+?) b/(.+)$', first_line)
              if not match or match.group(1) != match.group(2):
                  raise SystemExit(f'unexpected patch header: {first_line}')
              path = match.group(2)
              safe = re.sub(r'[^A-Za-z0-9._-]+', '-', pathlib.Path(path).name)
              encoded = base64.b64encode(chunk).decode('ascii')
              body = 'AEVRIX-PATCH-V1\n' + encoded + '\n'
              target = pathlib.Path('/tmp/envelopes') / f'{index:02d}-{safe}.txt'
              target.write_text(body, encoding='utf-8')
              print(f'{target.name} path={path} raw={len(chunk)} envelope={len(body)} sha256={hashlib.sha256(chunk).hexdigest()}')
          PY

      - name: Upload split queue envelopes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aevrix-desktop-patch-parts
          path: /tmp/envelopes/*.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
