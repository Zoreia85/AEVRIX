name: Desktop patch envelope transport

on:
  push:
    branches: [candidate/desktop-bot-patch-20260816-b]
    paths:
      - ".github/workflows/desktop-patch-envelope.yml"

permissions:
  contents: read

jobs:
  envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: bffaa2d43ea2d9f7ed587fa186b64cbc422bc320
    steps:
      - name: Checkout transport candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and validate product-only patch
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --binary "$BASE_SHA" HEAD -- \
            apps/aevrix-windows/src/AEVRIX.Desktop \
            apps/aevrix-windows/tests/AEVRIX.Core.Tests/EngineHostSupervisorTests.cs \
            > /tmp/aevrix-desktop.patch
          test -s /tmp/aevrix-desktop.patch
          test "$(wc -c < /tmp/aevrix-desktop.patch)" -lt 1500000
          git worktree add --detach /tmp/aevrix-base "$BASE_SHA"
          git -C /tmp/aevrix-base apply --check /tmp/aevrix-desktop.patch
          if grep -q '^diff --git a/\.github/workflows/' /tmp/aevrix-desktop.patch; then
            echo "Workflow content leaked into product patch."
            exit 1
          fi

      - name: Build queue envelope
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' 'AEVRIX-PATCH-V1'
            base64 -w 0 /tmp/aevrix-desktop.patch
            printf '\n'
          } > /tmp/issue-body.txt
          test "$(wc -c < /tmp/issue-body.txt)" -lt 2000000
          sha256sum /tmp/aevrix-desktop.patch /tmp/issue-body.txt

      - name: Upload queue envelope
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aevrix-desktop-patch-envelope
          path: /tmp/issue-body.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
