name: .NET core

on:
  push:
    paths:
      - "apps/aevrix-windows/src/AEVRIX.Core/**"
      - "apps/aevrix-windows/src/AEVRIX.EngineHost/**"
      - "apps/aevrix-windows/src/AEVRIX.Desktop/**"
      - "apps/aevrix-windows/tests/AEVRIX.Core.Tests/**"
      - "services/aevrix-remote-brain/**"
      - "global.json"
      - ".github/workflows/dotnet-core.yml"
  pull_request:
    paths:
      - "apps/aevrix-windows/src/AEVRIX.Core/**"
      - "apps/aevrix-windows/src/AEVRIX.EngineHost/**"
      - "apps/aevrix-windows/src/AEVRIX.Desktop/**"
      - "apps/aevrix-windows/tests/AEVRIX.Core.Tests/**"
      - "services/aevrix-remote-brain/**"
      - "global.json"
      - ".github/workflows/dotnet-core.yml"

permissions:
  contents: read

concurrency:
  group: dotnet-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Build Windows Desktop
        run: dotnet build ./apps/aevrix-windows/src/AEVRIX.Desktop/AEVRIX.Desktop.csproj -c Release -p:RuntimeIdentifier=win-x64

      - name: Publish installer-equivalent self-contained Desktop
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'desktop-self-contained'
          dotnet publish ./apps/aevrix-windows/src/AEVRIX.Desktop/AEVRIX.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:WindowsAppSDKSelfContained=true `
            -p:ContinuousIntegrationBuild=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o $out
          if ($LASTEXITCODE -ne 0) { throw "Self-contained publish failed: $LASTEXITCODE" }

      - name: Smoke self-contained Desktop
        id: self_contained_smoke
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/release/Test-DesktopStartup.ps1 `
            -DesktopPath (Join-Path $env:RUNNER_TEMP 'desktop-self-contained\AEVRIX.Desktop.exe') `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'self-contained-startup.json') `
            -AliveSeconds 5 `
            -ExitTimeoutSeconds 5

      - name: Acquire official Windows App Runtime 2.3.1 x64
        id: wasdk_runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://aka.ms/windowsappsdk/2.3/2.3.1/windowsappruntimeinstall-x64.exe'
          $path = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-2.3.1-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $path -MaximumRedirection 10
          if ((Get-Item -LiteralPath $path).Length -lt 1MB) { throw 'Windows App Runtime installer download is unexpectedly small.' }
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $sig = Get-AuthenticodeSignature -LiteralPath $path
          $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' }
          $thumbprint = if ($sig.SignerCertificate) { $sig.SignerCertificate.Thumbprint } else { '' }
          Write-Host "Windows App Runtime 2.3.1 x64: sha256=$hash signature=$($sig.Status) subject=$subject thumbprint=$thumbprint"
          if ($sig.Status -ne 'Valid') { throw "Official Windows App Runtime installer signature is not valid: $($sig.Status)" }
          if ($subject -notmatch 'Microsoft') { throw "Unexpected Windows App Runtime signer subject: $subject" }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signer_subject=$subject" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signer_thumbprint=$thumbprint" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install official Windows App Runtime 2.3.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process -FilePath '${{ steps.wasdk_runtime.outputs.path }}' -ArgumentList '--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Windows App Runtime installer exited with $($p.ExitCode)" }
          Write-Host 'Windows App Runtime installer completed with exit code 0.'

      - name: Publish framework-dependent Desktop
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'desktop-framework-dependent'
          dotnet publish ./apps/aevrix-windows/src/AEVRIX.Desktop/AEVRIX.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:Platform=x64 `
            -p:ContinuousIntegrationBuild=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o $out
          if ($LASTEXITCODE -ne 0) { throw "Framework-dependent publish failed: $LASTEXITCODE" }

      - name: Smoke framework-dependent Desktop
        id: framework_smoke
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/release/Test-DesktopStartup.ps1 `
            -DesktopPath (Join-Path $env:RUNNER_TEMP 'desktop-framework-dependent\AEVRIX.Desktop.exe') `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'framework-startup.json') `
            -AliveSeconds 5 `
            -ExitTimeoutSeconds 5

      - name: Diagnose deployment-mode comparison
        if: always()
        shell: pwsh
        env:
          SELF_CONTAINED_OUTCOME: ${{ steps.self_contained_smoke.outcome }}
          FRAMEWORK_OUTCOME: ${{ steps.framework_smoke.outcome }}
        run: |
          Write-Host "selfContained=$env:SELF_CONTAINED_OUTCOME frameworkDependent=$env:FRAMEWORK_OUTCOME"
          foreach ($name in @('self-contained-startup.json','framework-startup.json')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) {
              Write-Host "=== $name ==="
              Get-Content -LiteralPath $path -Raw | Write-Host
            }
          }
          Write-Host '=== recent application/runtime events mentioning AEVRIX or application errors ==='
          try {
            Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=(Get-Date).AddMinutes(-10) } -ErrorAction Stop |
              Where-Object { $_.ProviderName -in @('Application Error','.NET Runtime','Windows Error Reporting') -or $_.Message -match 'AEVRIX' } |
              Select-Object -First 40 TimeCreated,ProviderName,Id,LevelDisplayName,Message |
              Format-List | Out-String -Width 240 | Write-Host
          } catch {
            Write-Warning "Application event log diagnostic unavailable: $($_.Exception.Message)"
          }

      - name: Require framework-dependent startup
        if: always()
        shell: pwsh
        env:
          FRAMEWORK_OUTCOME: ${{ steps.framework_smoke.outcome }}
        run: |
          if ($env:FRAMEWORK_OUTCOME -ne 'success') {
            throw "Framework-dependent Desktop startup failed; see diagnostic comparison above."
          }

      - name: Test Windows Core
        run: dotnet test ./apps/aevrix-windows/tests/AEVRIX.Core.Tests/AEVRIX.Core.Tests.csproj -c Release

      - name: Test Remote Security
        run: dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Security.Tests/AEVRIX.Remote.Security.Tests.csproj -c Release

      - name: Test Orchestrator Judge
        run: dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Orchestration.Tests/AEVRIX.Remote.Orchestration.Tests.csproj -c Release
