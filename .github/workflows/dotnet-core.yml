name: .NET core

on:
  push:
    paths:
      - "apps/aevrix-windows/src/AEVRIX.Core/**"
      - "apps/aevrix-windows/src/AEVRIX.EngineHost/**"
      - "apps/aevrix-windows/src/AEVRIX.Desktop/**"
      - "apps/aevrix-windows/tests/AEVRIX.Core.Tests/**"
      - "services/aevrix-remote-brain/**"
      - "global.json"
      - ".github/workflows/dotnet-core.yml"

permissions:
  contents: read

concurrency:
  group: dotnet-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Build Windows Desktop and restore exact Windows App SDK runtime package
        run: dotnet build ./apps/aevrix-windows/src/AEVRIX.Desktop/AEVRIX.Desktop.csproj -c Release -p:RuntimeIdentifier=win-x64

      - name: Inspect exact Microsoft.WindowsAppSDK.Runtime 2.3.1 cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:USERPROFILE '.nuget\packages\microsoft.windowsappsdk.runtime\2.3.1'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "Exact Windows App SDK runtime NuGet package is missing: $root"
          }
          Write-Host "runtimePackageRoot=$root"
          $nupkg = Get-ChildItem -LiteralPath $root -File -Filter '*.nupkg' | Select-Object -First 1
          if ($null -ne $nupkg) {
            $nupkgHash = (Get-FileHash -LiteralPath $nupkg.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "nupkg=$($nupkg.Name) sha256=$nupkgHash bytes=$($nupkg.Length)"
          } else {
            Write-Warning 'NuGet cache does not retain the .nupkg file; package contents remain version-bound by exact restore.'
          }

          $candidates = Get-ChildItem -LiteralPath $root -Recurse -File |
            Where-Object { $_.Extension -in @('.msix','.msixbundle','.appx','.appxbundle','.exe') } |
            Sort-Object FullName
          if ($candidates.Count -eq 0) { throw 'Runtime package contains no deployable MSIX/EXE candidates.' }
          foreach ($file in $candidates) {
            $relative = [System.IO.Path]::GetRelativePath($root, $file.FullName)
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' }
            Write-Host "deployable=$relative bytes=$($file.Length) sha256=$hash signature=$($sig.Status) signer=$subject"
          }

          Write-Host '=== package top-level / architecture layout ==='
          Get-ChildItem -LiteralPath $root -Recurse -File |
            Where-Object { $_.FullName -match '(?i)(x64|msix|appx|installer|runtime)' } |
            ForEach-Object { [System.IO.Path]::GetRelativePath($root, $_.FullName) } |
            Sort-Object |
            Select-Object -First 260 |
            ForEach-Object { Write-Host $_ }

      - name: Test Windows Core
        run: dotnet test ./apps/aevrix-windows/tests/AEVRIX.Core.Tests/AEVRIX.Core.Tests.csproj -c Release

      - name: Test Remote Security
        run: dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Security.Tests/AEVRIX.Remote.Security.Tests.csproj -c Release

      - name: Test Orchestrator Judge
        run: dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Orchestration.Tests/AEVRIX.Remote.Orchestration.Tests.csproj -c Release
