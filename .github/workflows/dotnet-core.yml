name: .NET core

on:
  push:
    paths:
      - "apps/aevrix-windows/src/AEVRIX.Core/**"
      - "apps/aevrix-windows/src/AEVRIX.EngineHost/**"
      - "apps/aevrix-windows/src/AEVRIX.Desktop/**"
      - "apps/aevrix-windows/tests/AEVRIX.Core.Tests/**"
      - "services/aevrix-remote-brain/**"
      - "global.json"
      - ".github/workflows/dotnet-core.yml"
  pull_request:
    paths:
      - "apps/aevrix-windows/src/AEVRIX.Core/**"
      - "apps/aevrix-windows/src/AEVRIX.EngineHost/**"
      - "apps/aevrix-windows/src/AEVRIX.Desktop/**"
      - "apps/aevrix-windows/tests/AEVRIX.Core.Tests/**"
      - "services/aevrix-remote-brain/**"
      - "global.json"
      - ".github/workflows/dotnet-core.yml"

permissions:
  contents: read

concurrency:
  group: dotnet-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Build Windows Desktop
        run: dotnet build ./apps/aevrix-windows/src/AEVRIX.Desktop/AEVRIX.Desktop.csproj -c Release -p:RuntimeIdentifier=win-x64

      - name: Publish framework-dependent control
        shell: pwsh
        run: |
          dotnet publish ./apps/aevrix-windows/src/AEVRIX.Desktop/AEVRIX.Desktop.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -p:ContinuousIntegrationBuild=true -p:DebugType=none -p:DebugSymbols=false -o "$env:RUNNER_TEMP\framework"
          if ($LASTEXITCODE -ne 0) { throw "framework publish failed: $LASTEXITCODE" }

      - name: Smoke framework-dependent control
        id: framework
        continue-on-error: true
        shell: pwsh
        run: ./tools/release/Test-DesktopStartup.ps1 -DesktopPath "$env:RUNNER_TEMP\framework\AEVRIX.Desktop.exe" -OutputPath "$env:RUNNER_TEMP\framework.json" -AliveSeconds 5 -ExitTimeoutSeconds 5

      - name: Publish .NET self-contained with Windows App SDK external
        shell: pwsh
        run: |
          dotnet publish ./apps/aevrix-windows/src/AEVRIX.Desktop/AEVRIX.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=false -p:ContinuousIntegrationBuild=true -p:DebugType=none -p:DebugSymbols=false -o "$env:RUNNER_TEMP\dotnet-self"
          if ($LASTEXITCODE -ne 0) { throw ".NET self-contained publish failed: $LASTEXITCODE" }

      - name: Smoke .NET self-contained with Windows App SDK external
        id: dotnet_self
        continue-on-error: true
        shell: pwsh
        run: ./tools/release/Test-DesktopStartup.ps1 -DesktopPath "$env:RUNNER_TEMP\dotnet-self\AEVRIX.Desktop.exe" -OutputPath "$env:RUNNER_TEMP\dotnet-self.json" -AliveSeconds 5 -ExitTimeoutSeconds 5

      - name: Publish framework-dependent .NET with Windows App SDK self-contained
        id: wasdk_publish
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet publish ./apps/aevrix-windows/src/AEVRIX.Desktop/AEVRIX.Desktop.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:ContinuousIntegrationBuild=true -p:DebugType=none -p:DebugSymbols=false -o "$env:RUNNER_TEMP\wasdk-self"
          if ($LASTEXITCODE -ne 0) { throw "Windows App SDK self-contained publish failed: $LASTEXITCODE" }

      - name: Smoke framework-dependent .NET with Windows App SDK self-contained
        id: wasdk_self
        if: steps.wasdk_publish.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./tools/release/Test-DesktopStartup.ps1 -DesktopPath "$env:RUNNER_TEMP\wasdk-self\AEVRIX.Desktop.exe" -OutputPath "$env:RUNNER_TEMP\wasdk-self.json" -AliveSeconds 5 -ExitTimeoutSeconds 5

      - name: Publish fully self-contained installer mode
        shell: pwsh
        run: |
          dotnet publish ./apps/aevrix-windows/src/AEVRIX.Desktop/AEVRIX.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:ContinuousIntegrationBuild=true -p:DebugType=none -p:DebugSymbols=false -o "$env:RUNNER_TEMP\full-self"
          if ($LASTEXITCODE -ne 0) { throw "fully self-contained publish failed: $LASTEXITCODE" }

      - name: Smoke fully self-contained installer mode
        id: full_self
        continue-on-error: true
        shell: pwsh
        run: ./tools/release/Test-DesktopStartup.ps1 -DesktopPath "$env:RUNNER_TEMP\full-self\AEVRIX.Desktop.exe" -OutputPath "$env:RUNNER_TEMP\full-self.json" -AliveSeconds 5 -ExitTimeoutSeconds 5

      - name: Report deployment-mode matrix
        if: always()
        shell: pwsh
        env:
          FRAMEWORK: ${{ steps.framework.outcome }}
          DOTNET_SELF: ${{ steps.dotnet_self.outcome }}
          WASDK_PUBLISH: ${{ steps.wasdk_publish.outcome }}
          WASDK_SELF: ${{ steps.wasdk_self.outcome }}
          FULL_SELF: ${{ steps.full_self.outcome }}
        run: |
          Write-Host "framework=$env:FRAMEWORK dotnetSelf=$env:DOTNET_SELF wasdkPublish=$env:WASDK_PUBLISH wasdkSelf=$env:WASDK_SELF fullSelf=$env:FULL_SELF"
          foreach ($name in @('framework.json','dotnet-self.json','wasdk-self.json','full-self.json')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) {
              Write-Host "=== $name ==="
              Get-Content -LiteralPath $path -Raw | Write-Host
            }
          }
          foreach ($dir in @('framework','dotnet-self','wasdk-self','full-self')) {
            $root = Join-Path $env:RUNNER_TEMP $dir
            if (Test-Path -LiteralPath $root) {
              $xaml = Test-Path -LiteralPath (Join-Path $root 'Microsoft.UI.Xaml.dll')
              $coreclr = Test-Path -LiteralPath (Join-Path $root 'coreclr.dll')
              Write-Host "$dir: privateXaml=$xaml coreclr=$coreclr files=$((Get-ChildItem -LiteralPath $root -Recurse -File).Count)"
            }
          }
          if ($env:FRAMEWORK -ne 'success') {
            throw 'Framework-dependent control failed; deployment matrix is inconclusive.'
          }

      - name: Test Windows Core
        run: dotnet test ./apps/aevrix-windows/tests/AEVRIX.Core.Tests/AEVRIX.Core.Tests.csproj -c Release

      - name: Test Remote Security
        run: dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Security.Tests/AEVRIX.Remote.Security.Tests.csproj -c Release

      - name: Test Orchestrator Judge
        run: dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Orchestration.Tests/AEVRIX.Remote.Orchestration.Tests.csproj -c Release
