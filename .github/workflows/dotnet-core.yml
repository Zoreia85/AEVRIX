name: .NET core

on:
  push:
    paths:
      - "apps/aevrix-windows/src/AEVRIX.Core/**"
      - "apps/aevrix-windows/src/AEVRIX.EngineHost/**"
      - "apps/aevrix-windows/src/AEVRIX.Desktop/**"
      - "apps/aevrix-windows/tests/AEVRIX.Core.Tests/**"
      - "services/aevrix-remote-brain/**"
      - "global.json"
      - ".github/workflows/dotnet-core.yml"

permissions:
  contents: read

concurrency:
  group: dotnet-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Build Windows Desktop
        run: dotnet build ./apps/aevrix-windows/src/AEVRIX.Desktop/AEVRIX.Desktop.csproj -c Release -p:RuntimeIdentifier=win-x64

      - name: Publish framework-dependent Desktop
        shell: pwsh
        run: |
          dotnet publish ./apps/aevrix-windows/src/AEVRIX.Desktop/AEVRIX.Desktop.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o "$env:RUNNER_TEMP\desktop"
          if ($LASTEXITCODE -ne 0) { throw "Desktop publish failed: $LASTEXITCODE" }

      - name: Install signed Windows App Runtime 2.3.1 for compatibility diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://aka.ms/windowsappsdk/2.3/2.3.1/windowsappruntimeinstall-x64.exe'
          $path = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-2.3.1-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $path -MaximumRedirection 10
          $sig = Get-AuthenticodeSignature -LiteralPath $path
          $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' }
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "diagnosticRuntimeSha256=$hash signature=$($sig.Status) signer=$subject"
          if ($sig.Status -ne 'Valid' -or $subject -notmatch 'Microsoft') {
            throw 'Diagnostic Windows App Runtime installer is not validly signed by Microsoft.'
          }
          $p = Start-Process -FilePath $path -ArgumentList '--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Windows App Runtime diagnostic installer exited with $($p.ExitCode)" }

      - name: Prove post-first-run MainWindow starts without eager WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          $stateRoot = Join-Path $env:LOCALAPPDATA 'AEVRIX\UserData'
          $acceptancePath = Join-Path $stateRoot 'first-run-acceptance.json'
          $presentationPath = Join-Path $stateRoot 'first-run-presentation.json'
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null
          Remove-Item -LiteralPath $presentationPath -Force -ErrorAction SilentlyContinue
          @{
            SchemaVersion = 1
            TermsRevision = 'preview-authorized-use-v1'
            AcceptedAtUtc = [DateTimeOffset]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath $acceptancePath -Encoding utf8NoBOM

          $before = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
          $exe = Join-Path $env:RUNNER_TEMP 'desktop\AEVRIX.Desktop.exe'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = [DateTimeOffset]::UtcNow.AddSeconds(20)
            $mainFound = $false
            $window = $null
            while ([DateTimeOffset]::UtcNow -lt $deadline) {
              $process.Refresh()
              if ($process.HasExited) { throw "Desktop exited before MainWindow could be proven. ExitCode=$($process.ExitCode)" }
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $pidCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
              $window = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $pidCondition)
              if ($null -ne $window) {
                $nameCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Navegação principal do AEVRIX')
                $nav = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $nameCondition)
                if ($null -ne $nav) { $mainFound = $true; break }
              }
              Start-Sleep -Milliseconds 200
            }
            if (-not $mainFound) {
              $windowName = if ($null -ne $window) { $window.Current.Name } else { '<none>' }
              throw "MainWindow navigation was not observed after valid runtime + acceptance. topWindow=$windowName"
            }

            Start-Sleep -Seconds 3
            $after = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
            $newWebViewPids = @($after | Where-Object { $_ -notin $before })
            if ($newWebViewPids.Count -gt 0) {
              throw "Command Center startup eagerly created WebView2 processes without selecting/opening Research Browser: $($newWebViewPids -join ',')"
            }
            Write-Host "PASS: MainWindow observed after accepted first-run; no new msedgewebview2 process was created. desktopPid=$($process.Id)"
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Test Windows Core
        run: dotnet test ./apps/aevrix-windows/tests/AEVRIX.Core.Tests/AEVRIX.Core.Tests.csproj -c Release

      - name: Test Remote Security
        run: dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Security.Tests/AEVRIX.Remote.Security.Tests.csproj -c Release

      - name: Test Orchestrator Judge
        run: dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Orchestration.Tests/AEVRIX.Remote.Orchestration.Tests.csproj -c Release
