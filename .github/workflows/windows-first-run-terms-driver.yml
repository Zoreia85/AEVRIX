name: Windows first-run terms driver

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact bot-authored candidate SHA"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: windows-first-run-driver-${{ github.event_name }}-${{ github.event.comment.id || inputs.candidate_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch-after-installer:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 501 && github.event.comment.author_association == 'OWNER' && github.event.comment.body == '/aevrix-run-windows')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate exact canonical candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          main_sha="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          [[ "$main_sha" == "$CANDIDATE_SHA" ]] || { echo "candidate=$CANDIDATE_SHA main=$main_sha" >&2; exit 1; }
          author="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA} | python -c 'import json,sys; p=json.load(sys.stdin); print(p["commit"]["author"]["name"]+" <"+p["commit"]["author"]["email"]+">")')"
          [[ "$author" == 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' ]] || exit 1

      - name: Record cutoff and report start
        id: start
        shell: bash
        run: |
          echo "cutoff_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          python - <<'PY' > body.json
          import json,os
          print(json.dumps({'body':f"WINDOWS CHAIN STARTED — exact explicit chain\n\n- canonical candidate: `{os.environ['CANDIDATE_SHA']}`\n- driver run: `{os.environ['GITHUB_RUN_ID']}`\n- chain: installer -> explicit exact AVA\n- release credit: NONE until AVA PASS + S4"}))
          PY
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/501/comments -d @body.json >/dev/null

      - name: Dispatch exact Windows installer candidate
        shell: bash
        run: |
          code="$(curl -sS -o response.txt -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/windows-installer-candidate.yml/dispatches -d '{"ref":"main"}')"
          [[ "$code" == 204 ]] || { cat response.txt; exit 1; }

      - name: Resolve completed exact installer run
        id: installer
        env:
          CUTOFF_EPOCH: ${{ steps.start.outputs.cutoff_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/windows-installer-candidate.yml/runs?head_sha=${CANDIDATE_SHA}&per_page=30"
          for attempt in $(seq 1 180); do
            payload="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
            result="$(python -c 'import datetime,json,sys; p=json.load(sys.stdin); sha=sys.argv[1]; cutoff=int(sys.argv[2])-5; rs=[r for r in p.get("workflow_runs",[]) if r.get("head_sha")==sha and r.get("name")=="Windows installer candidate" and r.get("created_at") and int(datetime.datetime.fromisoformat(r["created_at"].replace("Z","+00:00")).timestamp())>=cutoff]; rs.sort(key=lambda r:r.get("created_at",""),reverse=True); r=rs[0] if rs else None; print("NONE" if r is None else "%s|%s|%s"%(r["id"],r["status"],r.get("conclusion") or ""))' "$CANDIDATE_SHA" "$CUTOFF_EPOCH" <<<"$payload")"
            IFS='|' read -r rid status conclusion <<<"$result"
            if [[ "$rid" != NONE && "$status" == completed ]]; then echo "installer_run_id=$rid" >> "$GITHUB_OUTPUT"; echo "installer_conclusion=$conclusion" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 15
          done
          exit 3

      - name: Fail closed on installer failure
        if: steps.installer.outputs.installer_conclusion != 'success'
        shell: bash
        run: exit 2

      - name: Explicitly dispatch exact installed first-run AVA
        if: steps.installer.outputs.installer_conclusion == 'success'
        env:
          INSTALLER_RUN_ID: ${{ steps.installer.outputs.installer_run_id }}
        shell: bash
        run: |
          python - <<'PY' > ava-body.json
          import json,os
          print(json.dumps({'ref':'main','inputs':{'installer_run_id':os.environ['INSTALLER_RUN_ID'],'candidate_sha':os.environ['CANDIDATE_SHA']}}))
          PY
          code="$(curl -sS -o response.txt -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/windows-first-run-terms-ava.yml/dispatches -d @ava-body.json)"
          [[ "$code" == 204 ]] || { cat response.txt; exit 1; }

      - name: Resolve explicit exact first-run AVA
        if: steps.installer.outputs.installer_conclusion == 'success'
        id: ava
        env:
          CUTOFF_EPOCH: ${{ steps.start.outputs.cutoff_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/windows-first-run-terms-ava.yml/runs?head_sha=${CANDIDATE_SHA}&event=workflow_dispatch&per_page=30"
          for attempt in $(seq 1 120); do
            payload="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
            result="$(python -c 'import datetime,json,sys; p=json.load(sys.stdin); sha=sys.argv[1]; cutoff=int(sys.argv[2])-5; rs=[r for r in p.get("workflow_runs",[]) if r.get("head_sha")==sha and r.get("name")=="Windows first-run terms AVA" and r.get("event")=="workflow_dispatch" and r.get("created_at") and int(datetime.datetime.fromisoformat(r["created_at"].replace("Z","+00:00")).timestamp())>=cutoff]; rs.sort(key=lambda r:r.get("created_at",""),reverse=True); r=rs[0] if rs else None; print("NONE" if r is None else "%s|%s|%s"%(r["id"],r["status"],r.get("conclusion") or ""))' "$CANDIDATE_SHA" "$CUTOFF_EPOCH" <<<"$payload")"
            IFS='|' read -r rid status conclusion <<<"$result"
            if [[ "$rid" != NONE && "$status" == completed ]]; then echo "ava_run_id=$rid" >> "$GITHUB_OUTPUT"; echo "ava_conclusion=$conclusion" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 15
          done
          exit 3

      - name: Report exact chain result to MASTER
        if: always() && steps.installer.outputs.installer_conclusion == 'success' && steps.ava.outputs.ava_run_id != ''
        env:
          INSTALLER_RUN_ID: ${{ steps.installer.outputs.installer_run_id }}
          AVA_RUN_ID: ${{ steps.ava.outputs.ava_run_id }}
          AVA_CONCLUSION: ${{ steps.ava.outputs.ava_conclusion }}
        shell: bash
        run: |
          python - <<'PY' > body.json
          import json,os
          c=os.environ['AVA_CONCLUSION'].upper(); state='PASS' if c=='SUCCESS' else 'FAIL'
          print(json.dumps({'body':f"WINDOWS INSTALLED CHAIN {state}\n\n- canonical candidate: `{os.environ['CANDIDATE_SHA']}`\n- driver run: `{os.environ['GITHUB_RUN_ID']}`\n- installer run: `{os.environ['INSTALLER_RUN_ID']}` — SUCCESS\n- explicit first-run AVA run: `{os.environ['AVA_RUN_ID']}` — **{c}**\n- next: S4 exact artifact/job verification"}))
          PY
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/501/comments -d @body.json >/dev/null

      - name: Enforce exact AVA success
        if: steps.installer.outputs.installer_conclusion == 'success' && steps.ava.outputs.ava_conclusion != 'success'
        shell: bash
        run: exit 4
