name: Windows first-run terms driver

on:
  repository_dispatch:
    types: [aevrix-candidate-promoted]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact bot-authored candidate SHA"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: windows-first-run-driver-${{ github.event.client_payload.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: true

jobs:
  dispatch-after-installer:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 501 &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.body == '/aevrix-run-windows'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CANDIDATE_SHA: ${{ github.event.client_payload.sha || inputs.candidate_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate exact candidate identity input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid candidate SHA: $CANDIDATE_SHA" >&2
            exit 1
          fi

      - name: Verify issue-command is bound to current canonical main
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"
          main_sha="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          if [[ "$main_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Issue-command SHA mismatch: event=$CANDIDATE_SHA current-main=$main_sha" >&2
            exit 1
          fi
          echo "Issue-command bound to canonical main $CANDIDATE_SHA"

      - name: Report MASTER-triggered chain start
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          set -euo pipefail
          body="$(python - <<'PY'
          import json, os
          text = (
              "WINDOWS CHAIN STARTED — MASTER command accepted\n\n"
              f"- canonical candidate: `{os.environ['CANDIDATE_SHA']}`\n"
              f"- driver run: `{os.environ['GITHUB_RUN_ID']}`\n"
              "- requested chain: Windows installer candidate -> installed first-run terms AVA\n"
              "- release credit: NONE until exact installed AVA completes PASS"
          )
          print(json.dumps({"body": text}))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/501/comments" \
            -d "$body" >/dev/null

      - name: Dispatch exact Windows installer candidate
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          set -euo pipefail
          body='{"ref":"main"}'
          code="$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/windows-installer-candidate.yml/dispatches" \
            -d "$body")"
          if [[ "$code" != "204" ]]; then
            cat response.txt >&2 || true
            echo "Windows installer candidate dispatch failed with HTTP $code" >&2
            exit 1
          fi
          echo "Dispatched Windows installer candidate for canonical main $CANDIDATE_SHA"

      - name: Resolve completed exact installer run
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/windows-installer-candidate.yml/runs?head_sha=${CANDIDATE_SHA}&per_page=20"
          run_id=""
          conclusion=""
          for attempt in $(seq 1 180); do
            payload="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            result="$(python -c 'import json,sys; p=json.load(sys.stdin); sha=sys.argv[1]; runs=[r for r in p.get("workflow_runs",[]) if r.get("head_sha")==sha and r.get("name")=="Windows installer candidate"]; runs.sort(key=lambda r:r.get("created_at", ""), reverse=True); r=runs[0] if runs else None; print("NONE" if r is None else "%s|%s|%s" % (r.get("id"), r.get("status"), r.get("conclusion") or ""))' "$CANDIDATE_SHA" <<<"$payload")"
            IFS='|' read -r candidate_run status candidate_conclusion <<<"$result"
            if [[ "$candidate_run" != "NONE" && "$status" == "completed" ]]; then
              run_id="$candidate_run"
              conclusion="$candidate_conclusion"
              break
            fi
            sleep 15
          done
          if [[ -z "$run_id" ]]; then
            echo "No completed exact installer run was resolved for $CANDIDATE_SHA within the bounded driver window." >&2
            exit 3
          fi
          echo "installer_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "installer_conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "Resolved exact installer run: $run_id / $conclusion"

      - name: Report and fail closed on installer failure
        if: steps.installer.outputs.installer_conclusion != 'success'
        env:
          INSTALLER_RUN_ID: ${{ steps.installer.outputs.installer_run_id }}
          INSTALLER_CONCLUSION: ${{ steps.installer.outputs.installer_conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(python - <<'PY'
          import json, os
          text = (
              "WINDOWS INSTALLER GATE FAILED\n\n"
              f"- candidate: `{os.environ['CANDIDATE_SHA']}`\n"
              f"- driver run: `{os.environ['GITHUB_RUN_ID']}`\n"
              f"- installer run: `{os.environ['INSTALLER_RUN_ID']}`\n"
              f"- installer conclusion: **{os.environ['INSTALLER_CONCLUSION'].upper()}**\n"
              "- first-run AVA: NOT DISPATCHED (fail-closed)\n"
              "- MASTER action: inspect exact installer run, quarantine/rework the failing Windows delta"
          )
          print(json.dumps({"body": text}))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/501/comments" \
            -d "$body" >/dev/null
          exit 2

      - name: Dispatch exact installed first-run terms AVA
        id: ava_dispatch
        env:
          INSTALLER_RUN_ID: ${{ steps.installer.outputs.installer_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch_epoch="$(date -u +%s)"
          body="$(python -c 'import json,os; print(json.dumps({"ref":"main","inputs":{"installer_run_id":os.environ["INSTALLER_RUN_ID"],"candidate_sha":os.environ["CANDIDATE_SHA"]}}))')"
          code="$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/windows-first-run-terms-ava.yml/dispatches" \
            -d "$body")"
          if [[ "$code" != "204" ]]; then
            cat response.txt >&2 || true
            echo "First-run AVA workflow dispatch failed with HTTP $code" >&2
            exit 1
          fi
          echo "dispatch_epoch=$dispatch_epoch" >> "$GITHUB_OUTPUT"
          echo "Dispatched Windows first-run terms AVA for candidate $CANDIDATE_SHA using installer run $INSTALLER_RUN_ID."

      - name: Resolve completed exact first-run AVA
        id: ava
        env:
          DISPATCH_EPOCH: ${{ steps.ava_dispatch.outputs.dispatch_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/windows-first-run-terms-ava.yml/runs?head_sha=${CANDIDATE_SHA}&event=workflow_dispatch&per_page=20"
          run_id=""
          conclusion=""
          for attempt in $(seq 1 120); do
            payload="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            result="$(python -c 'import datetime,json,sys; p=json.load(sys.stdin); sha=sys.argv[1]; cutoff=int(sys.argv[2])-5; runs=[]; [(runs.append(r) if (r.get("head_sha")==sha and r.get("name")=="Windows first-run terms AVA" and (lambda c: c >= cutoff)(int(datetime.datetime.fromisoformat((r.get("created_at") or "").replace("Z","+00:00")).timestamp()))) else None) for r in p.get("workflow_runs",[]) if r.get("created_at")]; runs.sort(key=lambda r:r.get("created_at",""), reverse=True); r=runs[0] if runs else None; print("NONE" if r is None else "%s|%s|%s" % (r.get("id"),r.get("status"),r.get("conclusion") or ""))' "$CANDIDATE_SHA" "$DISPATCH_EPOCH" <<<"$payload")"
            IFS='|' read -r candidate_run status candidate_conclusion <<<"$result"
            if [[ "$candidate_run" != "NONE" && "$status" == "completed" ]]; then
              run_id="$candidate_run"
              conclusion="$candidate_conclusion"
              break
            fi
            sleep 15
          done
          if [[ -z "$run_id" ]]; then
            body="$(python - <<'PY'
          import json, os
          text = (
              "WINDOWS AVA OBSERVABILITY TIMEOUT\n\n"
              f"- candidate: `{os.environ['CANDIDATE_SHA']}`\n"
              f"- driver run: `{os.environ['GITHUB_RUN_ID']}`\n"
              "- exact AVA run did not reach a completed observable state inside the bounded driver window\n"
              "- classification: INFRASTRUCTURE_INCONCLUSIVE, not product PASS"
          )
          print(json.dumps({"body": text}))
          PY
            )"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/501/comments" \
              -d "$body" >/dev/null
            exit 3
          fi
          echo "ava_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "ava_conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "Resolved exact first-run AVA: $run_id / $conclusion"

      - name: Report exact installed-chain result to MASTER
        env:
          INSTALLER_RUN_ID: ${{ steps.installer.outputs.installer_run_id }}
          AVA_RUN_ID: ${{ steps.ava.outputs.ava_run_id }}
          AVA_CONCLUSION: ${{ steps.ava.outputs.ava_conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(python - <<'PY'
          import json, os
          conclusion = os.environ["AVA_CONCLUSION"].upper()
          state = "PASS" if conclusion == "SUCCESS" else "FAIL"
          text = (
              f"WINDOWS INSTALLED CHAIN {state}\n\n"
              f"- canonical candidate: `{os.environ['CANDIDATE_SHA']}`\n"
              f"- driver run: `{os.environ['GITHUB_RUN_ID']}`\n"
              f"- installer run: `{os.environ['INSTALLER_RUN_ID']}` — SUCCESS\n"
              f"- first-run AVA run: `{os.environ['AVA_RUN_ID']}` — **{conclusion}**\n"
              "- MASTER action: inspect exact AVA jobs/artifacts before granting any Canary/release credit"
          )
          print(json.dumps({"body": text}))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/501/comments" \
            -d "$body" >/dev/null

      - name: Enforce exact AVA success
        if: steps.ava.outputs.ava_conclusion != 'success'
        env:
          AVA_RUN_ID: ${{ steps.ava.outputs.ava_run_id }}
          AVA_CONCLUSION: ${{ steps.ava.outputs.ava_conclusion }}
        shell: bash
        run: |
          echo "Exact first-run AVA $AVA_RUN_ID concluded $AVA_CONCLUSION; refusing release credit." >&2
          exit 4

      - name: Publish driver summary
        env:
          INSTALLER_RUN_ID: ${{ steps.installer.outputs.installer_run_id }}
          AVA_RUN_ID: ${{ steps.ava.outputs.ava_run_id }}
        shell: bash
        run: |
          {
            echo '## AEVRIX exact installed Windows chain'
            echo
            echo "- Exact candidate: \`$CANDIDATE_SHA\`"
            echo "- Exact installer run: **$INSTALLER_RUN_ID**"
            echo "- Exact first-run AVA run: **$AVA_RUN_ID**"
            echo '- Installed first-run chain: **PASS**'
            echo
            echo 'This driver result is evidence input for S4; it does not by itself grant RC/HOMOLOGATED status.'
          } >> "$GITHUB_STEP_SUMMARY"
