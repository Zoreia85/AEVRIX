name: Windows installed startup evidence contract

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/aevrix-windows/installer/collect-installed-startup-evidence.ps1"
      - ".github/workflows/windows-installed-startup-evidence-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert fail-closed missing-payload evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'Programs\AEVRIX-contract-empty'
          $evidence = Join-Path $env:RUNNER_TEMP 'startup-evidence.json'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          # Execute the collector in a child PowerShell process so its intentional
          # fail-closed exit code (20) can be asserted instead of terminating this gate.
          & pwsh -NoProfile -NonInteractive -File ./apps/aevrix-windows/installer/collect-installed-startup-evidence.ps1 `
            -InstallDirectory $root `
            -CandidateSha '${{ github.event.pull_request.head.sha || github.sha }}' `
            -EvidencePath $evidence `
            -ObservationSeconds 1
          $collectorExit = $LASTEXITCODE

          if ($collectorExit -ne 20) { throw "Expected missing-payload exit code 20, got $collectorExit" }
          if (-not (Test-Path -LiteralPath $evidence -PathType Leaf)) { throw 'Evidence file was not produced.' }
          if (-not (Test-Path -LiteralPath "$evidence.sha256" -PathType Leaf)) { throw 'Evidence hash file was not produced.' }
          $data = Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
          if ([int]$data.schemaVersion -ne 1) { throw 'Unexpected evidence schema.' }
          if (@($data.missingPayload).Count -ne 5) { throw "Expected five missing payload entries; got $(@($data.missingPayload).Count)." }
          if ($data.PSObject.Properties.Name -contains 'installDirectory') { throw 'Evidence must not disclose the absolute install directory.' }
          if ([string]$data.installDirectoryClass -ne 'LOCALAPPDATA_PROGRAMS_AEVRIX') { throw 'Install directory must be represented by disclosure-safe class only.' }
          $actual = (Get-FileHash -LiteralPath $evidence -Algorithm SHA256).Hash.ToLowerInvariant()
          $declared = ((Get-Content -LiteralPath "$evidence.sha256" -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $declared) { throw 'Evidence SHA-256 sidecar mismatch.' }
          Write-Host "PASS: fail-closed installed startup evidence contract SHA256=$actual"
