name: Privacy-safe baseline import

# Privacy root rewrite protocol v4: every non-bot push to main is audited and
# replaced with a bot-authored orphan root. This keeps validated tree content
# while preventing personal Git author metadata from remaining in canonical history.
#
# Writer discipline: normal AEVRIX code/docs changes use the privacy-safe patch
# queue. This rewrite keeps an independent concurrency group so identity cleanup
# cannot be cancelled by a burst of patch-queue events. If an exceptional direct
# write overlaps a patch validation, that patch remains open and is retried after
# this rewrite completes.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: aevrix-privacy-root-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify public source
        run: python3 tools/ci/public_repo_audit.py

      - name: Rewrite main as bot-authored root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tree"
          rsync -a --exclude='.git' ./ "$RUNNER_TEMP/tree/"
          git checkout --orphan privacy-safe-main
          git rm -rf .
          rsync -a "$RUNNER_TEMP/tree/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh privacy-safe AEVRIX root"
          git push --force origin HEAD:main
