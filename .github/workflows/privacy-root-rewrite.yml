name: Privacy-safe baseline import

# Privacy root rewrite protocol v5: every non-bot push to main is audited and
# replaced with a bot-authored orphan root only while that push still owns the
# current main tip. The rewrite shares the authoritative patch concurrency group
# so a stale privacy job can never race a validated patch promotion.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: aevrix-bot-patch-authoritative
  cancel-in-progress: false

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify rewrite still owns main tip
        id: ownership
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          ORIGIN_MAIN="$(git rev-parse origin/main)"
          if [ "$ORIGIN_MAIN" != "$GITHUB_SHA" ]; then
            echo "Privacy rewrite is stale; main advanced from $GITHUB_SHA to $ORIGIN_MAIN."
            echo "owns_tip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "owns_tip=true" >> "$GITHUB_OUTPUT"

      - name: Verify public source
        if: steps.ownership.outputs.owns_tip == 'true'
        run: python3 tools/ci/public_repo_audit.py

      - name: Rewrite main as bot-authored root
        if: steps.ownership.outputs.owns_tip == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tree"
          rsync -a --exclude='.git' ./ "$RUNNER_TEMP/tree/"
          git checkout --orphan privacy-safe-main
          git rm -rf .
          rsync -a "$RUNNER_TEMP/tree/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh privacy-safe AEVRIX root"
          git push --force-with-lease=main:${GITHUB_SHA} origin HEAD:main
