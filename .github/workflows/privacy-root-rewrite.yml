name: Privacy-safe canonicalization

# Canonicalization protocol v8.2.
# Non-bot main commits are replaced by one bot-authored commit whose parent is
# the most recent canonical bot/noreply ancestor. This removes the entire
# non-canonical segment while preserving the canonical ancestry before it.
# Bot Patch Queue promotions are already bot-authored; repository_dispatch only
# validates and dispatches evidence for the exact tip and never re-roots main.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [aevrix-canonicalize]

permissions:
  contents: write

concurrency:
  group: aevrix-bot-patch-authoritative
  cancel-in-progress: false

jobs:
  canonicalize:
    if: github.event_name == 'repository_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Bind exact canonical tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          lease_sha="$(git rev-parse origin/main)"
          git reset --hard "$lease_sha"
          echo "AEVRIX_PRIVACY_LEASE_SHA=$lease_sha" >> "$GITHUB_ENV"
          echo "Canonicalization bound to main $lease_sha"

      - name: Verify public source
        run: python3 tools/ci/public_repo_audit.py

      - name: Canonicalize non-bot chain without re-rooting
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        id: canonicalize
        shell: bash
        run: |
          set -euo pipefail

          offending_sha="$AEVRIX_PRIVACY_LEASE_SHA"
          tree_sha="$(git rev-parse "$offending_sha^{tree}")"
          cursor="$offending_sha"
          canonical_parent=""

          while true; do
            parent_count="$(git rev-list --parents -n 1 "$cursor" | awk '{print NF-1}')"
            if [ "$parent_count" -eq 0 ]; then
              echo "Refusing privacy replacement: no canonical bot/noreply ancestor exists." >&2
              exit 1
            fi
            if [ "$parent_count" -ne 1 ]; then
              echo "Refusing privacy replacement: non-canonical chain contains a merge commit at $cursor." >&2
              exit 1
            fi

            parent="$(git rev-parse "$cursor^")"
            parent_author="$(git show -s --format='%an <%ae>' "$parent")"
            case "$parent_author" in
              *"github-actions[bot]"*"@users.noreply.github.com>"*)
                canonical_parent="$parent"
                break
                ;;
              *) cursor="$parent" ;;
            esac
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          replacement_sha="$(printf '%s\n' 'chore: canonicalize privacy-safe AEVRIX commit' | git commit-tree "$tree_sha" -p "$canonical_parent")"

          replacement_author="$(git show -s --format='%an <%ae>' "$replacement_sha")"
          case "$replacement_author" in
            *"github-actions[bot]"*"@users.noreply.github.com>"*) ;;
            *)
              echo "Replacement commit metadata is not canonical bot/noreply." >&2
              exit 1
              ;;
          esac

          git push --force-with-lease=main:${AEVRIX_PRIVACY_LEASE_SHA} origin "$replacement_sha":main
          echo "sha=$replacement_sha" >> "$GITHUB_OUTPUT"
          echo "tree=$tree_sha" >> "$GITHUB_OUTPUT"
          echo "parent=$canonical_parent" >> "$GITHUB_OUTPUT"

      - name: Resolve exact bot-authored canonical candidate
        if: github.event_name == 'repository_dispatch'
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$AEVRIX_PRIVACY_LEASE_SHA"
          candidate_tree="$(git rev-parse "$candidate_sha^{tree}")"
          candidate_author="$(git show -s --format='%an <%ae>' "$candidate_sha")"
          case "$candidate_author" in
            *"github-actions[bot]"*"@users.noreply.github.com>"*) ;;
            *)
              echo "Repository-dispatch candidate is not bot/noreply canonical; refusing evidence dispatch." >&2
              exit 1
              ;;
          esac
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "tree=$candidate_tree" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact canonical candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_SHA: ${{ steps.canonicalize.outputs.sha }}
          PUSH_TREE: ${{ steps.canonicalize.outputs.tree }}
          EXISTING_SHA: ${{ steps.existing.outputs.sha }}
          EXISTING_TREE: ${{ steps.existing.outputs.tree }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          candidate_sha = os.environ.get("PUSH_SHA") or os.environ.get("EXISTING_SHA")
          candidate_tree = os.environ.get("PUSH_TREE") or os.environ.get("EXISTING_TREE")
          if not candidate_sha or not candidate_tree:
              raise SystemExit("missing exact canonical candidate identity")

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          payload = {
              "event_type": "aevrix-candidate-promoted",
              "client_payload": {"sha": candidate_sha, "tree": candidate_tree},
          }
          request = urllib.request.Request(
              f"{api}/repos/{repo}/dispatches",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "aevrix-canonical-evidence",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              response.read()
          PY
