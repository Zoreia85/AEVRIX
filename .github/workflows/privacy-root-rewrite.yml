name: Privacy-safe baseline import

# Privacy root rewrite protocol v6: every non-bot push to main is audited and
# replaced with a bot-authored orphan root. Privacy rewrite and patch promotion
# share one canonical-writer lock. Once the rewrite acquires that lock, it binds
# itself to the then-current remote main tip, audits that exact tree and may
# replace it only with force-with-lease against that captured SHA.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: aevrix-bot-patch-authoritative
  cancel-in-progress: false

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Bind exact canonical tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          lease_sha="$(git rev-parse origin/main)"
          git reset --hard "$lease_sha"
          echo "AEVRIX_PRIVACY_LEASE_SHA=$lease_sha" >> "$GITHUB_ENV"
          echo "Privacy rewrite bound to canonical main $lease_sha"

      - name: Verify public source
        run: python3 tools/ci/public_repo_audit.py

      - name: Rewrite main as bot-authored root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tree"
          rsync -a --exclude='.git' ./ "$RUNNER_TEMP/tree/"
          git checkout --orphan privacy-safe-main
          git rm -rf .
          rsync -a "$RUNNER_TEMP/tree/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh privacy-safe AEVRIX root"
          git push --force-with-lease=main:${AEVRIX_PRIVACY_LEASE_SHA} origin HEAD:main
