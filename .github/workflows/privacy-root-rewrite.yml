name: Privacy-safe baseline import

# Privacy root rewrite protocol v7: every non-bot push to main, and every
# successful patch-queue canonicalization request, is audited and replaced with
# a bot-authored orphan root. Privacy rewrite and patch promotion share one
# canonical-writer lock. Evidence is dispatched only after the final bot root is
# pushed successfully, carrying that exact root SHA and tree SHA.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [aevrix-canonicalize]

permissions:
  contents: write

concurrency:
  group: aevrix-bot-patch-authoritative
  cancel-in-progress: false

jobs:
  rewrite:
    if: github.event_name == 'repository_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Bind exact canonical tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          lease_sha="$(git rev-parse origin/main)"
          git reset --hard "$lease_sha"
          echo "AEVRIX_PRIVACY_LEASE_SHA=$lease_sha" >> "$GITHUB_ENV"
          echo "Privacy rewrite bound to canonical main $lease_sha"

      - name: Verify public source
        run: python3 tools/ci/public_repo_audit.py

      - name: Rewrite main as bot-authored root
        id: rewrite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tree"
          rsync -a --exclude='.git' ./ "$RUNNER_TEMP/tree/"
          git checkout --orphan privacy-safe-main
          git rm -rf .
          rsync -a "$RUNNER_TEMP/tree/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh privacy-safe AEVRIX root"
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          git push --force-with-lease=main:${AEVRIX_PRIVACY_LEASE_SHA} origin HEAD:main
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "tree=$candidate_tree" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact canonical candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.rewrite.outputs.sha }}
          CANDIDATE_TREE: ${{ steps.rewrite.outputs.tree }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          payload = {
              "event_type": "aevrix-candidate-promoted",
              "client_payload": {
                  "sha": os.environ["CANDIDATE_SHA"],
                  "tree": os.environ["CANDIDATE_TREE"],
              },
          }
          request = urllib.request.Request(
              f"{api}/repos/{repo}/dispatches",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "aevrix-canonical-evidence",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              response.read()
          PY
