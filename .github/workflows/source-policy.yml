name: Source policy

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Public source audit
        run: python3 tools/ci/public_repo_audit.py

      - name: Public/private IP boundary audit
        run: python3 tools/ci/ip_boundary_audit.py

      - name: Release evidence unit tests
        run: python3 -m unittest discover -s tools/release/tests -p 'test_*.py' -v
