name: Privacy cleanup

on:
  workflow_run:
    workflows: ["Privacy-safe baseline import"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete privacy-sensitive workflow-run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          trigger_sha = os.environ["TRIGGER_HEAD_SHA"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "aevrix-privacy-cleanup",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return response.read()

          def is_technical_email(value):
              if not value:
                  return True
              normalized = value.strip().lower()
              return (
                  normalized.endswith("@users.noreply.github.com")
                  or normalized == "noreply@github.com"
              )

          runs = []
          page = 1
          while page <= 10:
              raw = request(f"{api}/repos/{repo}/actions/runs?per_page=100&page={page}")
              batch = json.loads(raw).get("workflow_runs", [])
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          delete_ids = set()
          for run in runs:
              run_id = run.get("id")
              if not run_id or run_id == current_run_id:
                  continue
              if run.get("status") != "completed":
                  continue

              if run.get("name") == "Privacy-safe baseline import":
                  delete_ids.add(run_id)
                  continue

              if run.get("head_sha") == trigger_sha:
                  delete_ids.add(run_id)
                  continue

              head_commit = run.get("head_commit") or {}
              author = head_commit.get("author") or {}
              committer = head_commit.get("committer") or {}
              if not is_technical_email(author.get("email")) or not is_technical_email(committer.get("email")):
                  delete_ids.add(run_id)

          for run_id in sorted(delete_ids):
              try:
                  request(f"{api}/repos/{repo}/actions/runs/{run_id}", method="DELETE")
                  print(f"deleted workflow run {run_id}")
              except urllib.error.HTTPError as exc:
                  print(f"unable to delete workflow run {run_id}: HTTP {exc.code}")
              except Exception:
                  print(f"unable to delete workflow run {run_id}: unexpected error")
          PY
