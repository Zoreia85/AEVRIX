name: Privacy cleanup

on:
  workflow_run:
    workflows: ["Privacy-safe baseline import"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete migration workflow-run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          trigger_sha = os.environ["TRIGGER_HEAD_SHA"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "aevrix-privacy-cleanup",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return response.read()

          runs = []
          page = 1
          while True:
              raw = request(f"{api}/repos/{repo}/actions/runs?per_page=100&page={page}")
              batch = json.loads(raw).get("workflow_runs", [])
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          delete_ids = set()
          for run in runs:
              if run.get("name") == "Privacy-safe baseline import":
                  delete_ids.add(run["id"])
              if run.get("head_sha") == trigger_sha:
                  delete_ids.add(run["id"])

          for run_id in sorted(delete_ids):
              try:
                  request(f"{api}/repos/{repo}/actions/runs/{run_id}", method="DELETE")
                  print(f"deleted workflow run {run_id}")
              except Exception as exc:
                  print(f"unable to delete workflow run {run_id}: {exc}")
          PY
