name: Windows readiness V2

on:
  push:
    branches: [main]
    paths:
      - "apps/aevrix-windows/**"
      - "services/aevrix-remote-brain/**"
      - "docs/qa/**"
      - "tools/release/ava-readiness.py"
      - "tools/release/tests/**"
      - ".github/workflows/windows-readiness-v2.yml"
      - "global.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: windows-readiness-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: exact-candidate-readiness
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      AVA_DIR: ${{ runner.temp }}\aevrix-ava

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Initialize evidence directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:AVA_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:AVA_DIR "enginehost") | Out-Null

      - name: Test QA evaluator
        shell: pwsh
        run: python -m unittest discover -s tools/release/tests -p "test_ava_readiness.py" -v

      - name: Validate readiness model
        shell: pwsh
        run: python tools/release/ava-readiness.py validate-model --model docs/qa/readiness-model.json

      - name: Record exact candidate identity
        id: identity
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $sdk = (dotnet --version).Trim()
          $image = "$env:ImageOS/$env:ImageVersion"
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sdk=$sdk" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "image=$image" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          dotnet --info | Out-File -FilePath (Join-Path $env:AVA_DIR "dotnet-info.txt") -Encoding utf8
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture | Format-List | Out-File -FilePath (Join-Path $env:AVA_DIR "windows-info.txt") -Encoding utf8

      - name: Build EngineHost Release candidate
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet publish ./apps/aevrix-windows/src/AEVRIX.EngineHost/AEVRIX.EngineHost.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o (Join-Path $env:AVA_DIR "enginehost")

      - name: Test Windows Core
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test ./apps/aevrix-windows/tests/AEVRIX.Core.Tests/AEVRIX.Core.Tests.csproj `
            -c Release `
            --logger "trx;LogFileName=core.trx" `
            --results-directory $env:AVA_DIR

      - name: Test Remote Security
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Security.Tests/AEVRIX.Remote.Security.Tests.csproj `
            -c Release `
            --logger "trx;LogFileName=remote-security.trx" `
            --results-directory $env:AVA_DIR

      - name: Test Orchestrator Judge
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Orchestration.Tests/AEVRIX.Remote.Orchestration.Tests.csproj `
            -c Release `
            --logger "trx;LogFileName=orchestrator-judge.trx" `
            --results-directory $env:AVA_DIR

      - name: Generate fail-closed candidate evidence
        if: always()
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
          DOTNET_SDK: ${{ steps.identity.outputs.sdk }}
          RUNNER_IMAGE: ${{ steps.identity.outputs.image }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          $arguments = @(
            "tools/release/ava-readiness.py",
            "candidate",
            "--repo-root", ".",
            "--output-dir", $env:AVA_DIR,
            "--source-commit", $env:SOURCE_COMMIT,
            "--repository", $env:GITHUB_REPOSITORY,
            "--workflow-run-id", $env:GITHUB_RUN_ID,
            "--runner-os", $env:RUNNER_OS,
            "--runner-image", $env:RUNNER_IMAGE,
            "--runner-arch", $env:RUNNER_ARCH,
            "--dotnet-sdk", $env:DOTNET_SDK,
            "--build-outcome", $env:BUILD_OUTCOME,
            "--enginehost-dir", (Join-Path $env:AVA_DIR "enginehost"),
            "--core-trx", (Join-Path $env:AVA_DIR "core.trx"),
            "--security-trx", (Join-Path $env:AVA_DIR "remote-security.trx"),
            "--orchestration-trx", (Join-Path $env:AVA_DIR "orchestrator-judge.trx")
          )
          $external = "docs/qa/evidence/release-gates.json"
          if (Test-Path $external) {
            $arguments += @("--external-evidence", $external)
          }
          & python @arguments

      - name: Publish readiness summary
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $summary = Join-Path $env:AVA_DIR "summary.md"
          if (-not (Test-Path $summary)) {
            throw "candidate summary missing; readiness probe is infrastructure inconclusive"
          }
          Get-Content $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          gh issue comment 197 --repo $env:GITHUB_REPOSITORY --body-file $summary
