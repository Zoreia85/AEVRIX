name: Windows readiness V2

on:
  push:
    branches: [main]
    paths:
      - "apps/aevrix-windows/**"
      - "services/aevrix-remote-brain/**"
      - "docs/qa/**"
      - "tools/release/ava-readiness.py"
      - "tools/release/installer-evidence-to-release-gates.py"
      - "tools/release/tests/**"
      - "tools/release/AEVRIX.ReadinessSoak/**"
      - "tools/release/AEVRIX.EngineHostRecoveryProbe/**"
      - "tools/release/Test-DesktopStartup.ps1"
      - ".github/workflows/windows-readiness-v2.yml"
      - "global.json"
  repository_dispatch:
    types: [aevrix-candidate-promoted]
  workflow_run:
    workflows: ["Windows installer candidate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: windows-readiness-v2-${{ github.event_name }}-${{ github.event.workflow_run.id || github.event.client_payload.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: exact-candidate-readiness
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact evidence candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Initialize evidence directory
        shell: pwsh
        run: |
          $avaDir = Join-Path $env:RUNNER_TEMP "aevrix-ava"
          "AVA_DIR=$avaDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $avaDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $avaDir "enginehost") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $avaDir "desktop") | Out-Null

      - name: Test QA evaluator
        shell: pwsh
        run: python -m unittest discover -s tools/release/tests -p "test_*.py" -v

      - name: Validate readiness model
        shell: pwsh
        run: python tools/release/ava-readiness.py validate-model --model docs/qa/readiness-model.json

      - name: Record exact candidate identity
        id: identity
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $sdk = (dotnet --version).Trim()
          $image = "$env:ImageOS/$env:ImageVersion"
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sdk=$sdk" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "image=$image" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          dotnet --info | Out-File -FilePath (Join-Path $env:AVA_DIR "dotnet-info.txt") -Encoding utf8
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture | Format-List | Out-File -FilePath (Join-Path $env:AVA_DIR "windows-info.txt") -Encoding utf8

      - name: Import exact installer lifecycle evidence
        if: ${{ github.event_name == 'workflow_run' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactName = "aevrix-windows-installer-candidate-$env:SOURCE_COMMIT"
          $artifactRoot = Join-Path $env:RUNNER_TEMP "installer-evidence-import"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:INSTALLER_RUN_ID/artifacts" | ConvertFrom-Json
          $artifact = @($artifacts.artifacts | Where-Object { $_.name -eq $artifactName })
          if ($artifact.Count -ne 1) {
            throw "Expected exactly one exact-candidate installer artifact '$artifactName' in run $env:INSTALLER_RUN_ID; found $($artifact.Count)."
          }

          gh run download $env:INSTALLER_RUN_ID --repo $env:GITHUB_REPOSITORY --name $artifactName --dir $artifactRoot
          if ($LASTEXITCODE -ne 0) { throw "Failed to download installer evidence from run $env:INSTALLER_RUN_ID" }

          $candidateEvidence = Join-Path $artifactRoot "candidate-evidence.json"
          $lifecycleEvidence = Join-Path $artifactRoot "lifecycle-evidence.json"
          $releaseGates = Join-Path $env:AVA_DIR "release-gates.imported.json"
          $artifactDigest = [string]$artifact[0].digest
          $evidenceRef = "workflow-run:$env:INSTALLER_RUN_ID/artifact:$($artifact[0].id)/digest:$artifactDigest"

          python tools/release/installer-evidence-to-release-gates.py `
            --candidate-evidence $candidateEvidence `
            --lifecycle-evidence $lifecycleEvidence `
            --expected-source-commit $env:SOURCE_COMMIT `
            --evidence-ref $evidenceRef `
            --output $releaseGates
          if ($LASTEXITCODE -ne 0) { throw "Installer evidence bridge rejected imported lifecycle evidence." }

          "EXTERNAL_EVIDENCE=$releaseGates" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Copy-Item -LiteralPath $candidateEvidence -Destination (Join-Path $env:AVA_DIR "installer-candidate-evidence.json") -Force
          Copy-Item -LiteralPath $lifecycleEvidence -Destination (Join-Path $env:AVA_DIR "installer-lifecycle-evidence.json") -Force
          Write-Host "Imported exact installer evidence from run $env:INSTALLER_RUN_ID / artifact $($artifact[0].id) / digest $artifactDigest"

      - name: Build EngineHost Release candidate
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet publish ./apps/aevrix-windows/src/AEVRIX.EngineHost/AEVRIX.EngineHost.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o (Join-Path $env:AVA_DIR "enginehost")

      - name: Build Desktop Release candidate
        id: desktop_build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet publish ./apps/aevrix-windows/src/AEVRIX.Desktop/AEVRIX.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:Platform=x64 `
            -o (Join-Path $env:AVA_DIR "desktop")

      - name: Desktop startup and cleanup smoke
        id: desktop_startup
        continue-on-error: true
        shell: pwsh
        run: |
          $desktop = Join-Path $env:AVA_DIR "desktop\AEVRIX.Desktop.exe"
          $report = Join-Path $env:AVA_DIR "desktop-startup.json"
          ./tools/release/Test-DesktopStartup.ps1 `
            -DesktopPath $desktop `
            -OutputPath $report `
            -AliveSeconds 5 `
            -ExitTimeoutSeconds 5

      - name: EngineHost authenticated soak
        id: soak
        continue-on-error: true
        shell: pwsh
        run: |
          $engineHost = Join-Path $env:AVA_DIR "enginehost\AEVRIX.EngineHost.exe"
          $soakOutput = Join-Path $env:AVA_DIR "enginehost-soak.json"
          dotnet run --project ./tools/release/AEVRIX.ReadinessSoak/AEVRIX.ReadinessSoak.csproj `
            -c Release `
            -- `
            --enginehost $engineHost `
            --output $soakOutput `
            --iterations 250 `
            --restart-every 50 `
            --max-working-set-mib 512 `
            --max-private-growth-mib 128

      - name: EngineHost forced-crash recovery probe
        id: recovery
        continue-on-error: true
        shell: pwsh
        run: |
          $engineHost = Join-Path $env:AVA_DIR "enginehost\AEVRIX.EngineHost.exe"
          $recoveryOutput = Join-Path $env:AVA_DIR "enginehost-recovery.json"
          dotnet run --project ./tools/release/AEVRIX.EngineHostRecoveryProbe/AEVRIX.EngineHostRecoveryProbe.csproj `
            -c Release `
            -- `
            --enginehost $engineHost `
            --output $recoveryOutput `
            --startup-timeout-seconds 20 `
            --request-timeout-seconds 5 `
            --process-exit-timeout-seconds 5

      - name: Test Windows Core
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test ./apps/aevrix-windows/tests/AEVRIX.Core.Tests/AEVRIX.Core.Tests.csproj `
            -c Release `
            --logger "trx;LogFileName=core.trx" `
            --results-directory $env:AVA_DIR

      - name: Test Remote Security
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Security.Tests/AEVRIX.Remote.Security.Tests.csproj `
            -c Release `
            --logger "trx;LogFileName=remote-security.trx" `
            --results-directory $env:AVA_DIR

      - name: Test Orchestrator Judge
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Orchestration.Tests/AEVRIX.Remote.Orchestration.Tests.csproj `
            -c Release `
            --logger "trx;LogFileName=orchestrator-judge.trx" `
            --results-directory $env:AVA_DIR

      - name: Generate fail-closed candidate evidence
        if: always()
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
          DOTNET_SDK: ${{ steps.identity.outputs.sdk }}
          RUNNER_IMAGE: ${{ steps.identity.outputs.image }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DESKTOP_BUILD_OUTCOME: ${{ steps.desktop_build.outcome }}
        run: |
          $arguments = @(
            "tools/release/ava-readiness.py",
            "candidate",
            "--repo-root", ".",
            "--output-dir", $env:AVA_DIR,
            "--source-commit", $env:SOURCE_COMMIT,
            "--repository", $env:GITHUB_REPOSITORY,
            "--workflow-run-id", $env:GITHUB_RUN_ID,
            "--runner-os", $env:RUNNER_OS,
            "--runner-image", $env:RUNNER_IMAGE,
            "--runner-arch", $env:RUNNER_ARCH,
            "--dotnet-sdk", $env:DOTNET_SDK,
            "--build-outcome", $env:BUILD_OUTCOME,
            "--enginehost-dir", (Join-Path $env:AVA_DIR "enginehost"),
            "--desktop-build-outcome", $env:DESKTOP_BUILD_OUTCOME,
            "--desktop-dir", (Join-Path $env:AVA_DIR "desktop"),
            "--desktop-startup-json", (Join-Path $env:AVA_DIR "desktop-startup.json"),
            "--core-trx", (Join-Path $env:AVA_DIR "core.trx"),
            "--security-trx", (Join-Path $env:AVA_DIR "remote-security.trx"),
            "--orchestration-trx", (Join-Path $env:AVA_DIR "orchestrator-judge.trx"),
            "--soak-json", (Join-Path $env:AVA_DIR "enginehost-soak.json"),
            "--recovery-json", (Join-Path $env:AVA_DIR "enginehost-recovery.json")
          )
          if ($env:EXTERNAL_EVIDENCE -and (Test-Path $env:EXTERNAL_EVIDENCE)) {
            $arguments += @("--external-evidence", $env:EXTERNAL_EVIDENCE)
          }
          else {
            $staticExternal = "docs/qa/evidence/release-gates.json"
            if (Test-Path $staticExternal) {
              $arguments += @("--external-evidence", $staticExternal)
            }
          }
          & python @arguments

      - name: Upload exact-candidate AVA package
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aevrix-ava-${{ steps.identity.outputs.commit }}
          path: ${{ runner.temp }}/aevrix-ava
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Publish readiness summary
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          $summary = Join-Path $env:AVA_DIR "summary.md"
          if (-not (Test-Path $summary)) {
            throw "candidate summary missing; readiness probe is infrastructure inconclusive"
          }
          Add-Content -Path $summary -Encoding utf8 -Value ""
          Add-Content -Path $summary -Encoding utf8 -Value "- AVA artifact ID: ``$env:ARTIFACT_ID``"
          Add-Content -Path $summary -Encoding utf8 -Value "- AVA artifact digest: ``$env:ARTIFACT_DIGEST``"
          Add-Content -Path $summary -Encoding utf8 -Value "- AVA artifact URL: $env:ARTIFACT_URL"
          Get-Content $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          gh issue comment 197 --repo $env:GITHUB_REPOSITORY --body-file $summary
