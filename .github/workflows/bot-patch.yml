name: AEVRIX Bot Patch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aevrix-bot-patch
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.sender.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[AEVRIX-PATCH]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Decode owner patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)
          body = (event.get("issue", {}).get("body") or "").strip()
          lines = body.splitlines()
          if not lines or lines[0].strip() != "AEVRIX-PATCH-V1":
              raise SystemExit("invalid patch envelope")
          payload = "".join(line.strip() for line in lines[1:] if line.strip())
          if len(payload) > 2_000_000:
              raise SystemExit("patch payload too large")
          try:
              patch = base64.b64decode(payload, validate=True)
          except Exception as exc:
              raise SystemExit(f"invalid base64 payload: {exc}")
          if not patch or len(patch) > 1_500_000:
              raise SystemExit("invalid patch size")
          with open("/tmp/aevrix.patch", "wb") as fh:
              fh.write(patch)
          PY

      - name: Apply patch safely
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/aevrix.patch
          git apply /tmp/aevrix.patch
          if git diff --name-only --diff-filter=ACMR | grep -E '^\.github/workflows/'; then
            echo "Workflow files cannot be changed through the patch bot."
            exit 1
          fi
          if git diff --name-only --diff-filter=ACMR | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pfx|.*\.p12|.*\.pem|.*\.key)$'; then
            echo "Potential secret-bearing files are forbidden."
            exit 1
          fi

      - name: Public source audit
        run: python3 tools/ci/public_repo_audit.py

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Test Windows Core
        run: dotnet test ./apps/aevrix-windows/tests/AEVRIX.Core.Tests/AEVRIX.Core.Tests.csproj -c Release

      - name: Test Remote Security
        run: dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Security.Tests/AEVRIX.Remote.Security.Tests.csproj -c Release

      - name: Test Orchestrator Judge
        run: dotnet test ./services/aevrix-remote-brain/tests/AEVRIX.Remote.Orchestration.Tests/AEVRIX.Remote.Orchestration.Tests.csproj -c Release

      - name: Commit as GitHub bot
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: apply owner patch #${{ github.event.issue.number }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Close patch issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          issue = os.environ["ISSUE_NUMBER"]
          sha = os.environ["COMMIT_SHA"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "aevrix-bot-patch",
          }

          def send(path, payload, method="POST"):
              req = urllib.request.Request(
                  f"{api}/repos/{repo}/{path}",
                  data=json.dumps(payload).encode(),
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req) as response:
                  return response.read()

          send(f"issues/{issue}/comments", {"body": f"Patch validated and committed by automation: `{sha}`."})
          send(f"issues/{issue}", {"state": "closed", "state_reason": "completed"}, method="PATCH")
          PY
